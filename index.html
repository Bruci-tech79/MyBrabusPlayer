<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein IPTV Player</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        video { width: 80%; max-width: 800px; border: 2px solid #333; background: #000; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
    </style>
</head>
<body>

    <h1>Mein Eigener IPTV Web Player</h1>
    
    <!-- Eingabefeld für den Stream-Link (z.B. M3U oder direkter Stream) -->
    <input type="text" id="streamUrl" placeholder="Hier Stream-Link (.m3u8 oder mp4) einfügen" style="width: 60%;">
    <button onclick="playStream()">Abspielen</button>
    <br><br>

    <!-- Der Video-Player -->
    <video id="videoPlayer" controls autoplay></video>

    <!-- Script zum Laden des Streams (nutzt HLS.js für Kompatibilität) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        function playStream() {
            var video = document.getElementById('videoPlayer');
            var url = document.getElementById('streamUrl').value;
            
            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED,function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata',function() {
                    video.play();
                });
            }
        }
    </script>

</body>
</html>
