<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein IPTV Player</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        video { width: 80%; max-width: 800px; border: 2px solid #333; background: #000; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
    </style>
</head>
<body>

    <h1>Mein Eigener IPTV Web Player</h1>
    
    <input type="text" id="streamUrl" placeholder="Hier Stream-Link (.m3u8) einfügen" style="width: 60%;">
    <button onclick="playStream()">Abspielen</button>
    <br><br>

    <video id="videoPlayer" controls autoplay></video>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        let hls = null; // Globale Variable für den HLS-Player

        function playStream() {
            var video = document.getElementById('videoPlayer');
            var url = document.getElementById('streamUrl').value;
            
            // Alten HLS-Player zerstören, falls bereits einer lief
            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error("HLS Fehler:", data);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Für Safari / iOS
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }
    </script>

</body>
</html>
